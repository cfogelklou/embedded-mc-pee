name: live-gemini

on:
  push:
    branches: [main, init/library]
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'cfogelklou/embedded-mc-pee'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test examples
        run: npm run test:examples
        # Skip (not fail) when GEMINI_API_KEY secret is absent
        continue-on-error: false
        if: env.GEMINI_API_KEY != ''
